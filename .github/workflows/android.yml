
name: Build AutoVPN APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AutoVPN-0.3.6.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract Android project
        run: |
          test -f AutoVPN-0.3.6.zip
          unzip -o AutoVPN-0.3.6.zip
          test -f AutoVPN/settings.gradle.kts
          test -f AutoVPN/app/build.gradle.kts

      - name: Fix WireGuard manifest merge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("AutoVPN/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          if "xmlns:tools=" not in content:
              content = content.replace(
                  "<manifest ",
                  '<manifest xmlns:tools="http://schemas.android.com/tools" ',
                  1
              )

          pattern = r'(<service\b(?=[^>]*android:name=["\']com\.wireguard\.android\.backend\.GoBackend\$VpnService["\'])[^>]*)(>)'
          content, count = re.subn(
              pattern,
              lambda m: m.group(1) + ' tools:replace="android:exported"' + m.group(2),
              content,
              count=1,
              flags=re.S
          )

          if count != 1:
              raise SystemExit("Could not find WireGuard VpnService declaration")

          manifest.write_text(content)
          print("WireGuard manifest fixed")
          PY

      - name: Build debug APK
        run: gradle -p AutoVPN assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoVPN-debug-apk
          path: AutoVPN/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
